[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-hippo"
version = "0.1.0"
description = "A terminal-first multi-agent research assistant MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.50.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "rich>=13.7.0",
  "textual>=0.79.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["agents", "config", "core", "llm", "schemas", "ui"]
